// ─── SEGURIDAD BÁSICA (Tarea 5) ──────────────────────────────────────────
(function applySecurityMeasures() {
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (e.key === 'F12') { e.preventDefault(); return; }
    if (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) { e.preventDefault(); return; }
    if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return; }
  });
  // Detectar DevTools abierto (aproximación)
  let devToolsOpen = false;
  const threshold = 160;
  window.addEventListener('resize', () => {
    if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) {
      if (!devToolsOpen) { devToolsOpen = true; console.clear(); }
    } else { devToolsOpen = false; }
  });
  // Tarea 3: Anti-debugging periódico
  setInterval(() => {
    if (devToolsOpen) {
      console.clear();
      (function() { return false; }['constructor']('debugger')['call']());
    }
  }, 2000);
})();

// ─── ERROR BOUNDARY ──────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, info) { console.error("Error capturado:", error, info); }
  render() {
    if (this.state.hasError) return (
      <div className="flex h-full items-center justify-center bg-gray-50 p-4 min-h-[50vh]">
        <div className="bg-white p-6 rounded-2xl shadow-xl text-center border border-red-100 max-w-sm">

          <button onClick={() => window.location.reload()} className="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold btn-action">Recargar</button>
        </div>
      </div>
    );
    return this.props.children;
  }
}

// ─── VALIDADORES ─────────────────────────────────────────────────────────
const isValidEmail = (email) => {
  if (!email || email.trim() === '') return true;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email).trim().toLowerCase());
};
const isValidPhone = (phone) => {
  if (!phone || String(phone).trim() === '') return true;
  return /^\d{7,13}$/.test(String(phone).trim());
};

// ─── FORMATO DE FECHAS ────────────────────────────────────────────────────
const formatDateCO = (dateInput, includeTime = true) => {
  if (!dateInput) return '';
  const val = (dateInput && typeof dateInput === 'object' && dateInput.value) ? dateInput.value : dateInput;
  try {
    const d = new Date(val);
    if (isNaN(d.getTime())) return String(val);
    const options = { timeZone: 'America/Bogota', year: 'numeric', month: '2-digit', day: '2-digit' };
    if (includeTime) { options.hour = '2-digit'; options.minute = '2-digit'; options.hour12 = false; }
    return new Intl.DateTimeFormat('es-CO', options).format(d);
  } catch (e) { return String(val); }
};

// ─── COMUNICACIÓN CON SERVIDOR ───────────────────────────────────────────
const runServer = (endpoint, payload = {}) => {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script) {
      setTimeout(() => resolve({ success: true, message: 'Mock', data: [], total: 0 }), 400);
      return;
    }
    google.script.run
      .withSuccessHandler((res) => {
        if (res && res.error) reject(new Error(res.message));
        else resolve(res);
      })
      .withFailureHandler((err) => reject(err))
      .apiHandler({ endpoint, payload });
  });
};

// ─── UPLOAD VÍA PROXY ─────────────────────────────────────────────────────
const uploadFileViaProxy = (file, aliasName) => {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => {
      const base64 = reader.result.toString().replace(/^data:(.*,)?/, '');
      const iframeName = 'upload_' + Date.now() + Math.random();
      const iframe = document.createElement('iframe');
      iframe.name = iframeName; iframe.style.display = 'none';
      document.body.appendChild(iframe);
      const form = document.createElement('form');
      form.target = iframeName; form.action = PROXY_URL;
      form.method = 'POST'; form.style.display = 'none';
      const datos = { token: PROXY_TOKEN, filename: aliasName, mimetype: file.type, base64 };
      for (const key in datos) {
        const input = document.createElement('input');
        input.type = 'hidden'; input.name = key; input.value = datos[key];
        form.appendChild(input);
      }
      document.body.appendChild(form);
      iframe.onload = function() {
        setTimeout(() => {
          if (document.body.contains(form)) document.body.removeChild(form);
          if (document.body.contains(iframe)) document.body.removeChild(iframe);
        }, 2000);
        resolve(true);
      };
      form.submit();
    };
    reader.onerror = reject;
  });
};

const Toast = ({ message, type = 'info', onClose }) => {
  useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, [onClose]);
  const colors = { info: 'text-blue-500', success: 'text-green-500', error: 'text-red-500', warning: 'text-yellow-500' };
  const iconMap = { info: 'Info', success: 'CheckCircle', error: 'AlertTriangle', warning: 'AlertTriangle' };
  return (
    <div className="toast">
      <Icon name={iconMap[type] || 'Info'} className={colors[type] || colors.info} size={20}/>
      <span className="text-sm text-gray-700 font-medium">{message}</span>
      <button onClick={onClose} className="ml-2 text-gray-300 hover:text-gray-500"><Icon name="X" size={14}/></button>
    </div>
  );
};

const getStatusBadgeColor = (status) => {
  if (!status || status === 'None') return 'bg-gray-100 text-gray-600 border border-gray-200';
  const s = status.toString().toLowerCase();
  if (s.includes('confiable'))    return 'bg-green-100 text-green-700 border border-green-200';
  if (s.includes('proceso') || s.includes('en proceso')) return 'bg-blue-100 text-blue-700 border border-blue-200';
  if (s.includes('cancelado') || s.includes('no confiable')) return 'bg-red-100 text-red-700 border border-red-200';
  if (s.includes('pendiente'))    return 'bg-orange-100 text-orange-700 border border-orange-200';
  if (s.includes('creada') || s.includes('ingresada')) return 'bg-gray-100 text-gray-500 border border-gray-200';
  return 'bg-yellow-100 text-yellow-700 border border-yellow-200';
};

// ─── LISTA DE SOLICITUDES (con filtros de período) ────────────────────────
const PERIODS = [
  { key: 'today', label: 'Hoy'     },
  { key: 'week',  label: 'Semana'  },
  { key: 'month', label: 'Mes'     },
  { key: 'year',  label: 'Año'     },
];

const RequestList = ({ setView, setSelectedRequest, initialData, onRefresh, onChangePeriod, currentPeriod, refreshing, userContext, masterData }) => {
  const [filter,       setFilter]       = useState('Todo');
  const [search,       setSearch]       = useState('');
  const [page,         setPage]         = useState(1);
  const [dateRange,    setDateRange]    = useState({ start: '', end: '' });
  const [clientFilter, setClientFilter] = useState('');
  const [onlyMine,     setOnlyMine]     = useState(false);  // Tarea 6: filtro "Mis Solicitudes"

  const requests = useMemo(() => (initialData && Array.isArray(initialData.data)) ? initialData.data : [], [initialData]);

  const statusTabs = useMemo(() => {
    const displayStatuses = ['Todo', 'Cancelado', 'Confiable', 'Confiable preliminar', 'En proceso', 'Ingresada', 'No confiable', 'None'];
    const counts = { 'Todo': requests.length };
    
    requests.forEach(r => {
      let s = r.EstadoActual;
      if (!s || s.trim() === '') s = 'None';
      counts[s] = (counts[s] || 0) + 1;
    });

    return displayStatuses.map(s => ({ name: s, count: counts[s] || 0 }));
  }, [requests]);

  const filteredRequests = useMemo(() => {
    let result = requests;
    if (filter !== 'Todo') {
      if (filter === 'None') {
        result = result.filter(r => !r.EstadoActual || r.EstadoActual.trim() === '' || r.EstadoActual === 'None');
      } else {
        result = result.filter(r => r.EstadoActual === filter);
      }
    }
    if (onlyMine && userContext?.email) result = result.filter(r => r.UsuarioCreación === userContext.email);
    if (search) {
      const q = search.toLowerCase();
      result = result.filter(r => (String(r.NSolicitud || r.ID_SolicitudesConfiabilidad) + r.Identificacion + r.NombreCompleto).toLowerCase().includes(q));
    }
    if (dateRange.start) {
      const start = new Date(dateRange.start);
      result = result.filter(r => new Date(r.FechaSolicitud?.value || r.FechaSolicitud) >= start);
    }
    if (dateRange.end) {
      const end = new Date(dateRange.end); end.setHours(23,59,59);
      result = result.filter(r => new Date(r.FechaSolicitud?.value || r.FechaSolicitud) <= end);
    }
    if (clientFilter) result = result.filter(r => String(r.ID_Cliente) === String(clientFilter));
    return result;
  }, [requests, filter, search, dateRange, clientFilter, onlyMine, userContext]);

  const handleExport = () => {
    if (!filteredRequests.length) return alert("No hay datos para exportar.");
    const exportData = filteredRequests.filter(r => !['Creada','Ingresada'].includes((r.EstadoActual||'').trim()));
    if (!exportData.length) return alert("No hay registros válidos para exportar (se excluyen Creadas e Ingresadas).");
    const headers = Object.keys(exportData[0]);
    const csv = [headers.join(','), ...exportData.map(row => headers.map(f => `"${String(row[f]||'').replace(/"/g,'""')}"`).join(','))].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `historico_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  };

  useEffect(() => { setPage(1); }, [filter, search, dateRange, clientFilter, onlyMine, currentPeriod]);

  const paginatedData = filteredRequests.slice((page - 1) * 50, page * 50);
  const totalPages    = Math.ceil(filteredRequests.length / 50);

  const isForcedMyRequests = useMemo(() => {
    if (userContext?.isAdmin) return false;
    if (userContext?.role === 'Cliente Perfilado') return true;
    if (!clientFilter) return false;
    // Forzado a nivel de cliente O a nivel de relación usuario-cliente
    return userContext?.clientData?.[clientFilter]?.forcedMyRequests ||
           userContext?.userClientConfig?.[clientFilter]?.forcedMyRequests || false;
  }, [clientFilter, userContext]);

  useEffect(() => {
    if (isForcedMyRequests) setOnlyMine(true);
  }, [isForcedMyRequests]);

  return (
    <div className="p-4 md:p-6 h-full flex flex-col animate-fade-in overflow-hidden">
      {/* Barra de Filtros Estructurada */}
      <div className="bg-white rounded-2xl border border-gray-200 shadow-sm mb-4 overflow-hidden">
        <div className="p-4 bg-gray-50/50 border-b border-gray-100">
          <div className="flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <div className="bg-appBlue p-2 rounded-lg text-white shadow-sm">
                <Icon name="Filter" size={18}/>
              </div>
              <div>
                <h2 className="text-sm font-bold text-gray-800">Filtros de Búsqueda</h2>
                <p className="text-[10px] text-gray-500 font-medium uppercase tracking-wider">Gestión de Solicitudes</p>
              </div>
            </div>
            
            <div className="flex items-center gap-3">
              <button onClick={handleExport} className="px-4 py-2 text-vividGreen hover:bg-vividGreen/10 border border-vividGreen/20 rounded-2xl bg-white flex items-center gap-2 text-[10px] font-black uppercase tracking-tight transition-all btn-3d shadow-gray-200">
                <Icon name="Download" size={14}/> Exportar CSV
              </button>
              <button onClick={onRefresh} disabled={refreshing} className="px-4 py-2 text-vividBlue hover:bg-vividBlue/10 border border-vividBlue/20 rounded-2xl bg-white flex items-center gap-2 text-[10px] font-black uppercase tracking-tight transition-all btn-3d shadow-gray-200 disabled:opacity-50">
                <Icon name="RefreshCw" size={14} className={refreshing ? "animate-spin" : ""}/>
                {refreshing ? 'Sincronizando...' : 'Actualizar'}
              </button>
            </div>
          </div>
        </div>

        <div className="p-5 space-y-4">
          {/* Fila 1: Período y Mis Solicitudes */}
          <div className="flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-3 bg-gray-100 p-1 rounded-xl border border-gray-200">
              {PERIODS.map(p => (
                <button key={p.key} onClick={() => onChangePeriod(p.key)}
                  className={`px-4 py-1.5 rounded-lg text-[11px] font-bold transition-all ${currentPeriod === p.key ? 'bg-white text-appBlue shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>
                  {p.label}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-4">
               <label className={`flex items-center gap-3 p-2 px-4 rounded-xl border transition-all cursor-pointer select-none ${onlyMine ? 'bg-blue-50 border-blue-200' : 'bg-white border-gray-200'}`}>
                <div onClick={() => !isForcedMyRequests && setOnlyMine(!onlyMine)} className={`w-10 h-5 rounded-full transition-colors duration-200 flex items-center px-0.5 ${onlyMine ? 'bg-appBlue' : 'bg-gray-300'} ${isForcedMyRequests ? 'opacity-50 cursor-not-allowed' : ''}`}>
                  <div className={`w-4 h-4 bg-white rounded-full shadow transform transition-transform duration-200 ${onlyMine ? 'translate-x-5' : 'translate-x-0'}`}></div>
                </div>
                <span className={`text-xs font-bold ${onlyMine ? 'text-appBlue' : 'text-gray-600'}`}>Mis Solicitudes</span>
                {isForcedMyRequests && <Icon name="ShieldCheck" size={12} className="text-appBlue" title="Forzado por administrador"/>}
              </label>
              <div className="bg-gray-800 text-white px-3 py-2 rounded-xl text-xs font-black shadow-lg">
                {filteredRequests.length} <span className="text-[10px] text-gray-400 font-normal ml-1">REGISTROS</span>
              </div>
            </div>
          </div>

          {/* Fila 2: Búsqueda, Fechas y Cliente */}
          <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
            <div className="md:col-span-4 relative group">
              <div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-appBlue transition-colors"><Icon name="Search" size={16}/></div>
              <input type="text" className="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-appBlue/20 focus:border-appBlue transition-all"
                placeholder="ID, Cédula o Nombre del evaluado..." value={search} onChange={e => setSearch(e.target.value)}/>
            </div>

            <div className="md:col-span-4 flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-xl px-3 py-1">
              <Icon name="Calendar" size={14} className="text-gray-400"/>
              <input type="date" value={dateRange.start} onChange={e => setDateRange({...dateRange, start: e.target.value})}
                className="w-full bg-transparent p-1.5 text-[11px] font-medium focus:outline-none"/>
              <span className="text-gray-300">|</span>
              <input type="date" value={dateRange.end} onChange={e => setDateRange({...dateRange, end: e.target.value})}
                className="w-full bg-transparent p-1.5 text-[11px] font-medium focus:outline-none"/>
            </div>

            <div className="md:col-span-4">
              <select value={clientFilter} onChange={e => setClientFilter(e.target.value)}
                className="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-appBlue/20 focus:border-appBlue transition-all appearance-none cursor-pointer">
                <option value="">Todos los Clientes</option>
                {userContext?.allowedClientIds?.map(id => <option key={id} value={id}>{userContext.clientNames?.[id] || id}</option>)}
              </select>
            </div>
          </div>
        </div>
      </div>

      {refreshing && (
        <div className="flex items-center justify-center p-2 mb-3 bg-blue-50 border border-blue-100 rounded-lg animate-fade-in">
          <Icon name="RefreshCw" size={13} className="animate-spin text-blue-600 mr-2"/>
          <span className="text-xs font-bold text-blue-600">Cargando período: {PERIODS.find(p => p.key === currentPeriod)?.label}...</span>
        </div>
      )}

      {/* Tabs de estado */}
      <div className="flex gap-2 mb-3 overflow-x-auto pb-1">
        {statusTabs.map(tab => (
          <button key={tab.name} onClick={() => setFilter(tab.name)}
            className={`px-3 py-1 rounded-full text-xs font-bold transition whitespace-nowrap flex items-center gap-1.5 border btn-action ${filter === tab.name ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`}>
            {tab.name} <span className={`px-1.5 rounded-full text-[10px] ${filter === tab.name ? 'bg-gray-600 text-white' : 'bg-gray-100 text-gray-500'}`}>{tab.count}</span>
          </button>
        ))}
      </div>

      {/* Tabla - Tarea 4: Responsividad con scroll horizontal */}
      <div className="bg-white rounded-xl shadow-sm border overflow-hidden flex-1 flex flex-col">
        <div className="overflow-x-auto flex-1 custom-scrollbar">
          <div className="min-w-[1000px]">
            <div className="grid grid-cols-12 gap-2 p-3 border-b bg-gray-50 text-[10px] font-bold text-gray-400 uppercase tracking-tight sticky top-0 z-10">
          <div className="col-span-1">N° Sol</div>
          <div className="col-span-2">F. Solicitud</div>
          <div className="col-span-1">Cédula</div>
          <div className="col-span-2">Nombre / Cargo</div>
          <div className="col-span-1 text-center">Estado</div>
          <div className="col-span-1 text-center">Est. EP</div>
          <div className="col-span-1 text-center">P. Vis</div>
          <div className="col-span-1 text-center">P. Pol</div>
          <div className="col-span-1 text-center">E. ECP</div>
          <div className="col-span-1 text-center">E. EP</div>
        </div>
            <div className="divide-y divide-gray-100">
              {paginatedData.length === 0 ? (
                <div className="p-20 text-center flex flex-col items-center justify-center h-full">
              {refreshing
                ? <><Icon name="RefreshCw" size={32} className="animate-spin text-blue-500 mb-2"/><span className="text-gray-400 text-sm">Cargando...</span></>
                : <span className="text-gray-400 italic">No hay registros para el período seleccionado.</span>

              ) : paginatedData.map((req, i) => (

        {totalPages > 1 && (
          <div className="p-2 border-t flex justify-between bg-gray-50 items-center">

          </div>
        )}
      </div>
    </div>
  );
};

// ─── DETALLE DE SOLICITUD (carga bajo demanda) ────────────────────────────
const RequestDetail = ({ requestId, onBack, preloadedData }) => {
  const [detailData, setDetailData] = useState(null);
  const [loading, setLoading]       = useState(true);
  const [error, setError]           = useState(null);
  const [fileStates, setFileStates] = useState({});

  useEffect(() => {
    setLoading(true);
    setError(null);
    runServer('getRequestDetail', { id: requestId })
      .then(data => { setDetailData(data); setLoading(false); })
      .catch(err => { setError(err.message); setLoading(false); });
  }, [requestId]);

  const updateFileStatus = (fileName, status, message = "") =>
    setFileStates(prev => ({ ...prev, [fileName]: { status, message } }));

  const handleDownload = (input) => {
    let path = null;
    if (typeof input === 'string') path = input;
    else if (typeof input === 'object' && input !== null) path = input.Documento || input.URL || input.Archivo || input.NombreArchivo;
    if (!path) return alert("Datos de documento inválidos o sin ruta.");
    const filename = path.split(/[/\\]/).pop();
    if (!filename) return alert("No se pudo obtener el nombre del archivo.");
    updateFileStatus(filename, 'loading', 'Iniciando descarga...');
    const iframe = document.createElement('iframe');
    iframe.style.display = "none";
    iframe.src = `${PROXY_URL}?filename=${encodeURIComponent(filename)}&token=${PROXY_TOKEN}`;
    document.body.appendChild(iframe);
    setTimeout(() => {
      updateFileStatus(filename, 'success', 'Descarga iniciada ✓');
      setTimeout(() => { if (document.body.contains(iframe)) document.body.removeChild(iframe); }, 60000);
    }, 3000);
  };

  if (loading) return (
    <div className="flex items-center justify-center h-full p-10 flex-col gap-4">
      <div className="w-12 h-12 border-4 border-appBlue border-t-transparent rounded-full animate-spin"></div>
      <p className="text-sm text-gray-500">Cargando detalles de la solicitud...</p>
    </div>
  );

  if (error) return (
    <div className="p-10 text-center">
      <Icon name="AlertTriangle" size={40} className="text-red-500 mx-auto mb-3"/>
      <p className="text-red-600 font-bold mb-2">Error al cargar detalle</p>
      <p className="text-sm text-gray-500 mb-4">{error}</p>
      <button onClick={onBack} className="text-blue-600 underline text-sm">Volver al listado</button>
    </div>
  );

  const header = detailData?.header || preloadedData;

  const Card = ({ title, children, count }) => (
    <div className="bg-white rounded-xl shadow-sm border border-gray-200 mb-4 overflow-hidden">
      <div className="px-4 py-3 border-b border-gray-100 font-bold text-gray-700 text-sm uppercase flex justify-between">
        <span>{title}</span>
        {count !== undefined && <span className="bg-gray-100 text-gray-600 px-2 rounded-full text-xs flex items-center">{count}</span>}
      </div>
      <div>{children}</div>
    </div>
  );

  const DetailField = ({ label, value }) => (
    <div className="border-b border-gray-50 pb-2 last:border-0">
      <div className="text-[10px] font-bold text-gray-400 uppercase tracking-wide">{label}</div>
      <div className="text-sm text-gray-700 font-medium break-words">{value || 'N/A'}</div>
    </div>
  );

  const GenericList = ({ items, labelKey, dateKey }) => (
    items?.length > 0
      ? <ul className="divide-y divide-gray-100">{items.map((item, i) => (
          <li key={i} className="p-3 text-sm hover:bg-gray-50">
            <div className="font-medium text-gray-700">{item[labelKey] || JSON.stringify(item)}</div>
            {dateKey && item[dateKey] && <div className="text-xs text-gray-400">{item[dateKey]}</div>}
          </li>
        ))}</ul>
      : <div className="p-4 text-center text-xs text-gray-400 italic">No hay registros.</div>
  );

  const DownloadRow = ({ path, label, date }) => {
    if (!path) return null;
    const filename = path.split(/[/\\]/).pop();
    const fs = fileStates[filename] || {};
    return (
      <div className="flex items-center justify-between bg-blue-50 p-2.5 rounded border border-blue-100 mb-2">
        <div className="flex items-center gap-3 overflow-hidden flex-1">

          <Icon name={fs.status==='loading'?'RefreshCw':'Download'} size={15} className={fs.status==='loading'?'animate-spin':''}/>

  return (

      <button onClick={onBack} className="mb-4 text-gray-500 hover:text-gray-800 flex items-center gap-1 text-sm btn-action">

      </button>
      <div className="grid grid-cols-12 gap-6">
        <div className="col-span-12 md:col-span-8 space-y-4">
          <Card title="Información Detallada">
            <div className="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
              <DetailField label="Cliente"  value={header.Cliente || header.RazonSocial}/>
              <DetailField label="NIT"      value={header.NIT}/>
              <div className="col-span-2 mt-1 border-b border-gray-200 pb-1"><h4 className="text-xs font-bold text-blue-600 uppercase">Fechas Clave</h4></div>

              {header.ArchivoInforme && (

              <div className="col-span-2 mt-1 border-b border-gray-200 pb-1"><h4 className="text-xs font-bold text-appRed uppercase">Información Del Evaluado</h4></div>
              <DetailField label="Nombre Completo"       value={header.NombreCompleto}/>
              <DetailField label="Tipo Identificación"   value={header.TipoIdentificacion}/>
              <DetailField label="Identificación"        value={header.Identificacion}/>
              <DetailField label="Cargo"                 value={header.Cargo}/>
              <DetailField label="Ciudad"                value={header.Ciudad}/>
              <DetailField label="Dirección"             value={header.Direccion}/>

          {(detailData?.poligrafia?.length > 0) && (

                    <div className="text-right"><div className="text-[10px] text-gray-400 uppercase">Actualización</div><div className="text-xs text-gray-500">{item.FechaActualización || item.FechaActualizacion || ''}</div></div>
                  </div>

                    <div><span className="font-bold text-gray-800">Concepto:</span> {item.ConceptoEP}</div>
                    <div><span className="font-bold text-gray-800">Nivel Riesgo:</span> <span className="bg-gray-100 px-1.5 rounded">{item.NivelRiesgo}</span></div>
                    <div><span className="font-bold text-gray-800">Admisiones:</span> {item.Admisiones}</div>
                    <div><span className="font-bold text-gray-800">Elaborado Por:</span> {item.ElaboradoPor}</div>
                  </div>
                  {item.InformeEstudioPoligrafia && <DownloadRow path={item.InformeEstudioPoligrafia} label="Informe Estudio Poligrafía"/>}

          {(detailData?.datacredito?.length > 0) && (
            <Card title="Consulta Datacrédito" count={detailData.datacredito.length}>
              {detailData.datacredito.map((item, i) => (
                <div key={i} className="px-4 py-2">
                  <DownloadRow path={item.Archivo} label={`Consulta - ${item.FechaActualizacion || item.FechaConsulta || ''}`}/>
                </div>
              ))}
            </Card>
          )}
        </div>
        <div className="col-span-12 md:col-span-4 space-y-4">
          <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 text-center">
            <div className="text-gray-400 text-xs font-bold mb-1">ESTADO ACTUAL</div>
            <div className={`text-2xl font-black mb-2 uppercase ${getStatusBadgeColor(header.EstadoActual).split(' ')[1]}`}>{header.EstadoActual}</div>
            <div className="text-gray-500 text-xs bg-gray-100 inline-block px-2 py-1 rounded">ID: {header.NSolicitud || header.ID_SolicitudesConfiabilidad}</div>
            {header.EstadoActualEP && (
              <div className="mt-2 pt-2 border-t border-gray-100">
                <div className="text-xs text-gray-400 font-bold mb-1">ESTADO EP</div>
                <span className="inline-flex items-center justify-center px-2 h-[22px] rounded text-[9px] font-bold uppercase bg-purple-100 text-purple-700 border border-purple-200">{header.EstadoActualEP}</span>
              </div>
            )}
          </div>
          <Card title="Servicios Aplicados" count={detailData?.services?.length}>
            {detailData?.services?.length > 0
              ? <ul className="divide-y">{detailData.services.map((s,i) => (
                  <li key={i} className="px-4 py-3 hover:bg-gray-50">
                    <div className="flex justify-between items-center mb-1">
                      <span className="font-bold text-sm text-gray-700">{s.TipoServicio || s.Servicio || s.ServicioAplicar}</span>
                      <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${s.EstadoActual === 'Finalizado' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>{s.EstadoActual || s.Estado}</span>
                    </div>
                    <div className="text-[10px] text-gray-400 flex items-center gap-1"><Icon name="Clock" size={10}/> {s.FechaActualizacion || s.Fecha || 'Pendiente'}</div>
                  </li>
                ))}</ul>
              : <div className="p-4 text-center text-xs text-gray-400 italic">No hay servicios registrados.</div>
            }
          </Card>
          {detailData?.autFirmada?.length > 0 && (
            <Card title="Autorizaciones Firmadas" count={detailData.autFirmada.length}>
              {detailData.autFirmada.map((doc, i) => (
                <div key={i} className="px-4 py-2">
                  <DownloadRow path={doc.Archivo || doc.NombreArchivo} label={doc.NombreArchivo || 'Autorización Firmada'} date={doc.FechaActualizacion}/>
                </div>
              ))}
            </Card>
          )}
          {detailData?.documents?.length > 0 && (
            <Card title="Documentos" count={detailData.documents.length}>
              {detailData.documents.map((doc, i) => (
                <div key={i} className="px-4 py-2">
                  <DownloadRow path={doc.Documento || doc.URL || doc.Archivo} label={doc.NombreDocumento || doc.Nombre || 'Documento'} date={doc.FechaActualizacion}/>
                </div>
              ))}
            </Card>
          )}
        </div>
      </div>
    </div>
  );
};

// ─── CREAR SOLICITUD ──────────────────────────────────────────────────────
const CreateRequest = ({ userContext, setView, onReload, masterData }) => {
  const [step, setStep]                         = useState(1);
  const [uploading, setUploading]               = useState(false);
  const [uploadProgress, setUploadProgress]     = useState({ current: 0, total: 0 });
  const [showSuccess, setShowSuccess]           = useState(false);
  const [showValidationAlert, setShowValidationAlert] = useState(false);
  const [missingFields, setMissingFields]       = useState([]);
  const [createdId, setCreatedId]               = useState('');
  const [showPersonalRefWarning, setShowPersonalRefWarning] = useState(false);
  const [attachments, setAttachments]           = useState([]);
  const [currentFile, setCurrentFile]           = useState(null);
  const [currentDocName, setCurrentDocName]     = useState('');

  useEffect(() => {
    if (showPersonalRefWarning) { const t = setTimeout(() => setShowPersonalRefWarning(false), 3000); return () => clearTimeout(t); }
  }, [showPersonalRefWarning]);

  const [formData, setFormData] = useState({
    fechaSolicitud: new Date().toLocaleString(), clientId: '', nombre: '', nit: '', razonSocial: '',
    tipoIdentificacion: '', identificacion: '', fechaExpedicion: '', cargo: '', correo: '',
    celular: '', ciudad: '', barrio: '', direccion: '', tipoTrabajador: 'Nuevo', centroCostos: '',
    visitaDomiciliaria: false, modalidadVisita: '', consultaAntecedentes: false,
    referenciacion: false, referenciaAcademica: null, referenciaLaboral: null, referenciaPersonal: null,
    estudiosPoligrafia: false, tipoPoligrafia: '', ciudadPoligrafia: '', consultaDatacredito: false,
    comparativoOEA: false, notas: '', clienteProyectoInterno: '', linea: '', lineaNegocio: '',
    clienteClientesSecundarios: '', nitClienteSecundario: '', convenioClienteSecundario: '',
    tipoCostoClienteSecundario: '', centroCostosExterno: ''
  });

  const ciudadesList          = useMemo(() => masterData?.conCiudades || [], [masterData]);
  const ciudadesPoligrafiaList = useMemo(() => masterData?.conPoligrafias || [], [masterData]);
  const clienteProyectoList   = useMemo(() => masterData?.ClienteProyecto || [], [masterData]);
  const lineaCCList           = useMemo(() => masterData?.LineaCC || [], [masterData]);
  const secondaryClientsRaw   = useMemo(() => masterData?.conClientesSecundarios || [], [masterData]);

  const availableSecondaryClients = useMemo(() => {
    if (!formData.clientId) return [];
    return secondaryClientsRaw.filter(i => String(i.ClientePrincipal) === String(formData.clientId)).map(i => i.ClienteSecundarioNombre);
  }, [formData.clientId, secondaryClientsRaw]);

  const clientType = useMemo(() => (formData.clientId && userContext?.clientTypes) ? userContext.clientTypes[formData.clientId] : '', [formData.clientId, userContext]);
  const isInternal = useMemo(() => clientType === 'Interno', [clientType]);

  const uniqueLineas   = useMemo(() => [...new Set(lineaCCList.map(i => i.Linea))].sort(), [lineaCCList]);
  const availableLNs   = useMemo(() => !formData.linea ? [] : [...new Set(lineaCCList.filter(i => i.Linea === formData.linea).map(i => i.LN_Nombre))].sort(), [formData.linea, lineaCCList]);
  const availableCCs   = useMemo(() => (!formData.linea || !formData.lineaNegocio) ? [] : [...new Set(lineaCCList.filter(i => i.Linea === formData.linea && i.LN_Nombre === formData.lineaNegocio).map(i => i.CC_Nombre))].sort(), [formData.linea, formData.lineaNegocio, lineaCCList]);

  const handleChange = (e) => {
    const { name, value } = e.target;
    if (name === 'clientId') {
      const cd = userContext?.clientData?.[value];
      setFormData(p => ({ ...p, [name]: value, nit: cd?.nit || '', razonSocial: cd?.razonSocial || '' }));
    } else if (name === 'linea') {
      setFormData(p => ({ ...p, [name]: value, lineaNegocio: '', centroCostos: '' }));
    } else if (name === 'lineaNegocio') {
      setFormData(p => ({ ...p, [name]: value, centroCostos: '' }));
    } else {
      setFormData(p => ({ ...p, [name]: value }));
    }
  };

  // FIX Tarea 2: solo dígitos, sin type="number"
  const handleCelularChange = (e) => {
    const val = e.target.value.replace(/\D/g, '');
    if (val.length <= 13) setFormData(p => ({ ...p, celular: val }));
  };

  const handleIdentificacionChange = (e) => {
    const val = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    if (val.length <= 15) setFormData(p => ({ ...p, identificacion: val }));
  };

  const handleToggle = (name, val) => {
    if (name === 'referenciaPersonal' && val === true && formData.visitaDomiciliaria) { setShowPersonalRefWarning(true); return; }
    setFormData(p => {
      const next = { ...p, [name]: val };
      if (name === 'visitaDomiciliaria' && val === true) next.referenciaPersonal = false;
      return next;
    });
  };

  const addAttachment = () => {
    if (!currentFile) return alert("Seleccione un archivo.");
    if (!currentDocName.trim()) return alert("Ingrese un nombre para el documento.");
    setAttachments(a => [...a, { id: Date.now(), file: currentFile, name: currentDocName }]);
    setCurrentFile(null); setCurrentDocName('');
    document.getElementById('fileInput').value = "";
  };

  const resetForm = () => {
    setFormData({ fechaSolicitud: new Date().toLocaleString(), clientId: '', nombre: '', nit: '', razonSocial: '',
      tipoIdentificacion: '', identificacion: '', fechaExpedicion: '', cargo: '', correo: '', celular: '',
      ciudad: '', barrio: '', direccion: '', tipoTrabajador: 'Nuevo', centroCostos: '',
      visitaDomiciliaria: false, modalidadVisita: '', consultaAntecedentes: false,
      referenciacion: false, referenciaAcademica: null, referenciaLaboral: null, referenciaPersonal: null,
      estudiosPoligrafia: false, tipoPoligrafia: '', ciudadPoligrafia: '', consultaDatacredito: false,
      comparativoOEA: false, notas: '', clienteProyectoInterno: '', linea: '', lineaNegocio: '',
      clienteClientesSecundarios: '', nitClienteSecundario: '', convenioClienteSecundario: '',
      tipoCostoClienteSecundario: '', centroCostosExterno: '' });
    setAttachments([]); setStep(1); setShowSuccess(false);
  };

  const handleSubmit = async () => {
    const missing = [];
    if (!formData.clientId)        missing.push("ID Cliente");
    if (!formData.nombre)          missing.push("Nombre Completo");
    if (!formData.tipoIdentificacion) missing.push("Tipo de Identificación");
    if (!formData.identificacion)  missing.push("Número de Identificación");
    else if (formData.identificacion.length < 5 || formData.identificacion.length > 15) missing.push("Identificación: entre 5 y 15 caracteres");
    if (!formData.cargo)           missing.push("Cargo");
    if (!formData.celular)         missing.push("Celular");
    else if (!isValidPhone(formData.celular)) missing.push("Celular inválido (solo dígitos, 7 a 13)");
    if (!formData.ciudad)          missing.push("Ciudad");
    if (!formData.direccion)       missing.push("Dirección");
    if (!formData.tipoTrabajador)  missing.push("Tipo Trabajador");
    if (formData.correo && !isValidEmail(formData.correo)) missing.push("Formato de Correo inválido");
    if (isInternal) {
      if (!formData.linea)        missing.push("Línea");
      if (!formData.lineaNegocio) missing.push("Línea de Negocio");
      if (!formData.centroCostos) missing.push("Centro de Costos");
      if (formData.consultaAntecedentes && attachments.length === 0) missing.push("Documento de Soporte (obligatorio para Antecedentes)");
    }
    if (formData.visitaDomiciliaria && !formData.modalidadVisita) missing.push("Modalidad Visita");
    if (formData.referenciacion) {
      if (formData.referenciaAcademica === null) missing.push("Referencia Académica (seleccione SÍ o NO)");
      if (formData.referenciaLaboral   === null) missing.push("Referencia Laboral (seleccione SÍ o NO)");
      if (formData.referenciaPersonal  === null) missing.push("Referencia Personal (seleccione SÍ o NO)");
    }
    if (formData.estudiosPoligrafia) {
      if (!formData.tipoPoligrafia)  missing.push("Tipo de Poligrafía");
      if (!formData.ciudadPoligrafia) missing.push("Ciudad Poligrafía");
    }
    const hasService = formData.visitaDomiciliaria || formData.consultaAntecedentes || formData.referenciacion || formData.estudiosPoligrafia || formData.consultaDatacredito || formData.comparativoOEA;
    if (!hasService) missing.push("Debe seleccionar al menos un servicio a aplicar");

    if (missing.length > 0) { setMissingFields(missing); setShowValidationAlert(true); return; }

    setUploading(true);
    setUploadProgress({ current: 0, total: attachments.length });

    const payload = {
      ...formData,
      visitaDomiciliaria: formData.visitaDomiciliaria ? 'SI' : 'NO',
      consultaAntecedentes: formData.consultaAntecedentes ? 'SI' : 'NO',
      referenciacion: formData.referenciacion ? 'SI' : 'NO',
      referenciaAcademica: formData.referenciaAcademica === true ? 'SI' : 'NO',
      referenciaLaboral:   formData.referenciaLaboral   === true ? 'SI' : 'NO',
      referenciaPersonal:  formData.referenciaPersonal  === true ? 'SI' : 'NO',
      estudiosPoligrafia: formData.estudiosPoligrafia ? 'SI' : 'NO',
      consultaDatacredito: formData.consultaDatacredito ? 'SI' : 'NO',
      comparativoOEA:     formData.comparativoOEA     ? 'SI' : 'NO',
    };

    try {
      const response = await runServer('createRequest', payload);
      if (!response.success) throw new Error(response.message || "Error al crear solicitud.");
      const newId = response.requestId;
      let processed = 0;
      for (const att of attachments) {
        const aliasName = `${newId}_${att.file.name}`;
        await uploadFileViaProxy(att.file, aliasName);
        await runServer('registerTempDocument', { requestId: newId, docName: att.name, fileName: aliasName });
        processed++;
        setUploadProgress(p => ({ ...p, current: processed }));
      }
      setUploading(false);
      setCreatedId(newId);
      if (onReload) onReload();
      setShowSuccess(true);
    } catch (error) {
      console.error(error);
      alert("Error procesando solicitud: " + error.message);
      setUploading(false);
    }
  };

  if (showSuccess) return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/30 backdrop-blur-sm animate-fade-in">
      <div className="bg-white p-10 rounded-3xl shadow-2xl text-center max-w-md w-full border border-gray-100 animate-scale-in">
        <div className="w-24 h-24 bg-vividGreen/10 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-inner transform rotate-12">
          <Icon name="CheckCircle" size={48} className="text-vividGreen -rotate-12"/>
        </div>
        <h2 className="text-3xl font-black text-gray-800 mb-2 tracking-tight">¡Éxito Total!</h2>
        <p className="text-gray-400 text-xs font-bold uppercase tracking-widest mb-8 text-center">La solicitud ha sido procesada</p>

        <div className="bg-gray-50/50 p-6 rounded-3xl border border-gray-100 text-left mb-8 space-y-4">
          <div className="flex justify-between items-center">
            <span className="text-[10px] font-black text-gray-400 uppercase tracking-widest">ID Solicitud</span>
            <span className="font-mono font-black text-vividBlue bg-white px-3 py-1 rounded-xl shadow-sm border border-gray-100">{createdId}</span>
          </div>
          <div className="flex justify-between items-center">
            <span className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Evaluado</span>
            <span className="font-black text-gray-700 truncate ml-4 uppercase text-[11px]">{formData.nombre}</span>
          </div>
        </div>

        <div className="grid grid-cols-1 gap-4">
          <button onClick={resetForm} className="btn-3d-blue py-4 rounded-2xl flex items-center justify-center gap-3">
            <Icon name="ClipboardList" size={18}/> <span className="text-xs font-black uppercase tracking-widest">Crear Nueva</span>
          </button>
          <button onClick={() => setView('history')} className="btn-3d-gray py-4 rounded-2xl flex items-center justify-center gap-3">
            <Icon name="History" size={18}/> <span className="text-xs font-black uppercase tracking-widest text-gray-600">Ver Historial</span>
          </button>
        </div>
      </div>
    </div>
  );

  const inputClass = "w-full border border-gray-200 rounded-xl p-2 text-xs focus:ring-2 focus:ring-vividBlue/20 focus:border-vividBlue outline-none transition-all bg-gray-50/50 hover:bg-white";
  const labelClass = "text-[10px] font-black text-gray-400 uppercase tracking-wider mb-1 block";
  const fieldClass = "flex flex-col";

  return (
    <div className="p-4 md:p-8 max-w-5xl mx-auto animate-fade-in pb-20">
      {/* Stepper */}
      <div className="flex items-center justify-center mb-10">
        <div className="flex items-center group cursor-pointer" onClick={() => setStep(1)}>
          <div className={`w-10 h-10 rounded-2xl flex items-center justify-center font-black text-sm transition-all shadow-lg ${step===1?'bg-vividRed text-white shadow-red-500/40 scale-110':'bg-white text-gray-400 border border-gray-100'}`}>1</div>
          <div className="ml-4">
             <span className={`block text-[10px] font-black uppercase tracking-widest ${step===1?'text-vividRed':'text-gray-400'}`}>Paso 1</span>
             <span className={`text-xs font-bold ${step===1?'text-gray-800':'text-gray-400'}`}>Información Evaluado</span>
          </div>
        </div>
        <div className="w-16 h-1 bg-gray-100 mx-6 rounded-full overflow-hidden">
           <div className={`h-full bg-vividRed transition-all duration-500 ${step===2?'w-full':'w-0'}`}></div>
        </div>
        <div className="flex items-center group cursor-pointer" onClick={() => step === 2 && setStep(2)}>
          <div className={`w-10 h-10 rounded-2xl flex items-center justify-center font-black text-sm transition-all shadow-lg ${step===2?'bg-vividRed text-white shadow-red-500/40 scale-110':'bg-white text-gray-400 border border-gray-100'}`}>2</div>
          <div className="ml-4">
             <span className={`block text-[10px] font-black uppercase tracking-widest ${step===2?'text-vividRed':'text-gray-400'}`}>Paso 2</span>
             <span className={`text-xs font-bold ${step===2?'text-gray-800':'text-gray-400'}`}>Servicios A Aplicar</span>
          </div>
        </div>
      </div>

      <div className="card-3d p-6 md:p-10 border-none">
        {step === 1 && (
          <div className="animate-fade-in space-y-8">
            <div className="flex items-center justify-between border-b border-gray-100 pb-4">

// ─── CARGA MASIVA (Tarea 7: log detallado) ───────────────────────────────
const BulkUpload = ({ userContext, setView, onReload }) => {
  const [selectedClient, setSelectedClient] = useState('');
  const [downloading, setDownloading]       = useState(false);
  const [uploading, setUploading]           = useState(false);
  const [file, setFile]                     = useState(null);
  const [uploadResult, setUploadResult]     = useState(null);
  const [showValidationAlert, setShowValidationAlert] = useState(false);
  const [validationErrors, setValidationErrors]       = useState([]);

  const clients = useMemo(() => userContext?.allowedClientIds || [], [userContext]);
  useEffect(() => { if (clients.length > 0 && !selectedClient) setSelectedClient(clients[0]); }, [clients]);

  const handleDownloadTemplate = async () => {
    if (!selectedClient) { alert("Por favor seleccione un cliente primero."); return; }
    setDownloading(true);
    try {
      const response = await runServer('getTemplateName', { clientId: selectedClient });
      if (!response.success) throw new Error(response.message || "Error al obtener plantilla.");
      const iframe = document.createElement('iframe');
      iframe.style.display = "none";
      iframe.src = `${PROXY_URL}?filename=${encodeURIComponent(response.filename)}&token=${PROXY_TOKEN}`;
      document.body.appendChild(iframe);
      setTimeout(() => { setDownloading(false); setTimeout(() => { if(document.body.contains(iframe)) document.body.removeChild(iframe); }, 60000); }, 3000);
    } catch (e) { alert("Error: " + e.message); setDownloading(false); }
  };

  const handleUpload = async () => {
    if (!selectedClient) return alert("Seleccione un cliente.");
    if (!file) return alert("Seleccione un archivo CSV para cargar.");
    setUploading(true);
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const csvContent = e.target.result;
        const base64Content = csvContent.split(',')[1];
        const decodedText = atob(base64Content);
        const rows = decodedText.split(/\r\n|\n|\r/);
        if (rows.length < 2) throw new Error("El archivo está vacío o sin datos.");
        const delimiter = rows[0].includes(';') ? ';' : ',';
        const headers = rows[0].split(delimiter).map(h => h.trim().replace(/^"|"$/g, '').toUpperCase());
        const correoIdx  = headers.findIndex(h => h.includes("CORREO") || h.includes("EMAIL"));
        const celularIdx = headers.findIndex(h => h.includes("CELULAR") || h.includes("MOVIL") || h.includes("TELEFONO"));
        const frontErrors = [];
        for (let i = 1; i < rows.length; i++) {
          const line = rows[i].trim(); if (!line) continue;
          const cols = line.split(delimiter); const rowNum = i + 1;
          if (correoIdx !== -1 && cols[correoIdx]) {
            const val = cols[correoIdx].trim().replace(/^"|"$/g, '');
            if (val && !isValidEmail(val)) frontErrors.push(`Fila ${rowNum}: Correo inválido (${val})`);
          }
          if (celularIdx !== -1 && cols[celularIdx]) {
            const val = cols[celularIdx].trim().replace(/^"|"$/g, '');
            if (val && !isValidPhone(val)) frontErrors.push(`Fila ${rowNum}: Celular inválido (${val})`);
          }
        }
        if (frontErrors.length > 0) { setValidationErrors(frontErrors); setShowValidationAlert(true); setUploading(false); return; }
        const response = await runServer('processBulkUpload', { csvContent: base64Content, clientId: selectedClient });
        if (response.success) { setUploadResult(response); if (onReload) onReload(); }
        else {
          // Errores de validación del backend
          setValidationErrors(response.errorList || [response.message]);
          setShowValidationAlert(true);
        }
      } catch (err) { alert("Error en carga masiva: " + err.message); }
      finally { setUploading(false); }
    };
    reader.readAsDataURL(file);
  };

  if (uploadResult) return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/30 backdrop-blur-sm animate-fade-in">
      <div className="bg-white p-10 rounded-3xl shadow-2xl text-center max-w-md w-full border border-gray-100 animate-scale-in">
        <div className="w-24 h-24 bg-vividGreen/10 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-inner transform rotate-12">
          <Icon name="CheckCircle" size={48} className="text-vividGreen -rotate-12"/>
        </div>
        <h2 className="text-3xl font-black text-gray-800 mb-2 tracking-tight">¡Carga Finalizada!</h2>
        <p className="text-gray-400 text-xs font-bold uppercase tracking-widest mb-8 text-center">Resultados del procesamiento masivo</p>

        <div className="bg-gray-50/50 p-6 rounded-3xl border border-gray-100 text-left mb-6 space-y-4">
          <div className="flex justify-between items-center">
            <span className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Exitosos</span>

const AdminClientModal = ({ clientId, clientName, onClose, showToast }) => {

  const [updating, setUpdating] = useState(null);
  const [search, setSearch] = useState('');

  const filteredUsers = useMemo(() => {
    if (!search) return users;
    const q = search.toLowerCase();
    return users.filter(u => u.Email.toLowerCase().includes(q) || u.Rol_Asignado.toLowerCase().includes(q));
  }, [users, search]);

  useEffect(() => {
    runServer('getClientUsers', { clientId })
      .then(res => { setUsers(res || []); setLoading(false); })
      .catch(e => { showToast(e.message, "error"); setLoading(false); });
  }, [clientId]);

  const handleUpdate = async (targetEmail, role, userForced) => {
    setUpdating(targetEmail);
    try {
      await runServer('updateUserConfig', { targetEmail, clientId, role, userForced });
      setUsers(prev => prev.map(u => u.Email === targetEmail ? {
        ...u,
        Rol_Asignado: role || u.Rol_Asignado,

      } : u));

    { id: 'Cliente Completo', title: 'Completo', desc: 'Acceso total y visibilidad de todas las solicitudes del cliente.' },

            </div>
            <button onClick={onClose} className="p-2 hover:bg-gray-200 rounded-full transition-colors"><Icon name="X" size={24}/></button>
          </div>
        </div>

        <div className="flex-1 overflow-y-auto p-6 bg-gray-50/30">

            <div className="flex flex-col items-center py-20 gap-4">
              <div className="w-10 h-10 border-4 border-appBlue border-t-transparent rounded-full animate-spin"></div>
              <p className="text-gray-400 text-sm">Cargando usuarios...</p>
            </div>
          ) : filteredUsers.length === 0 ? (
            <div className="text-center py-20 text-gray-400 italic">No se encontraron usuarios.</div>
          ) : (
            <div className="space-y-6">
              {filteredUsers.map(u => (
                <div key={u.Email} className="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm transition-all overflow-hidden relative">
                   {updating === u.Email && (
                    <div className="absolute inset-0 bg-white/60 backdrop-blur-[1px] z-10 flex items-center justify-center">
                      <div className="w-8 h-8 border-4 border-appBlue border-t-transparent rounded-full animate-spin"></div>

                  )}
                  <div className="flex flex-col gap-4">
                    <div className="flex items-center gap-3 border-b border-gray-100 pb-3">
                      <div className="p-2.5 bg-blue-50 text-blue-600 rounded-xl"><Icon name="User" size={20}/></div>
                      <div>

                        <div className="text-[10px] uppercase font-black text-blue-500 bg-blue-50 px-2 py-0.5 rounded inline-block mt-0.5">Perfil Actual: {u.Rol_Asignado}</div>
                      </div>

                      {ROLES_INFO.map(role => (
                        <div

// ─── APP PRINCIPAL ────────────────────────────────────────────────────────
const App = () => {
  const [userCtx,       setUserCtx]       = useState(null);
  const [initError,     setInitError]     = useState(null);
  const [sidebarOpen,   setSidebarOpen]   = useState(false);
  const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(true);
  const [view,          setView]          = useState('loading');
  const [selectedRequest, setSelectedRequest] = useState(null);
  const [syncStatus,    setSyncStatus]    = useState('idle');
  const [lastSync,      setLastSync]      = useState(null);
  const [toast,         setToast]         = useState(null);
  const [initialData,   setInitialData]   = useState({ data: [], total: 0 });
  const [masterData,    setMasterData]    = useState(null);
  const [period,        setPeriod]        = useState('today');
  const [isLoading,     setIsLoading]     = useState(true);

  const showToast = (message, type = 'info') => setToast({ message, type });

  const loadRequests = useCallback(async (periodKey = period) => {
    if (syncStatus !== 'idle') return;
    setSyncStatus('requests');
    try {
      const reqs = await runServer('getRequests', { period: periodKey });
      setInitialData(reqs);
      setLastSync(Date.now());
    } catch (e) {
      showToast("Error cargando solicitudes: " + e.message, 'error');
    } finally {
      setSyncStatus('idle');
    }
  }, [period, syncStatus]);

  const loadMasterData = useCallback(async () => {
    setSyncStatus('master');
    try {
      const master = await runServer('getMasterData', {});
      setMasterData(master);
    } catch (e) {
      console.warn("Error cargando datos maestros:", e.message);
    } finally {
      setSyncStatus('idle');
    }
  }, []);

  const refreshAll = async (manual = false, periodKey = period) => {
    if (syncStatus !== 'idle' && !manual) return;
    try {
      setSyncStatus('requests');
      const reqs = await runServer('getRequests', { period: periodKey });
      setInitialData(reqs);
      setSyncStatus('master');
      const master = await runServer('getMasterData', {});
      setMasterData(master);
      setLastSync(Date.now());
      if (manual) showToast("Datos actualizados.", 'success');
    } catch (e) {
      showToast("Error en sincronización: " + e.message, 'error');
    } finally {
      setSyncStatus('idle');
    }
  };

  const handleChangePeriod = (newPeriod) => {
    setPeriod(newPeriod);
    loadRequests(newPeriod);
  };

  const handleRefreshClients = async () => {
    showToast("Actualizando clientes...", 'info');
    try {
      const updatedCtx = await runServer('refreshUserContext', {});
      setUserCtx(updatedCtx);
      await refreshAll(true, period);
      showToast("Clientes y datos actualizados.", 'success');
    } catch (e) {
      showToast("Error al actualizar: " + e.message, 'error');
    }
  };

  const handleLogin = async () => {
    setIsLoading(true);
    try {
      const ctx = await runServer('getUserContext', {});
      setUserCtx(ctx);
      if (ctx.isValidUser) {
        const isHistoryDefault = ['Cliente Consulta', 'Cliente Perfilado'].includes(ctx.role);
        const defaultPeriod = isHistoryDefault ? 'year' : 'today';
        setPeriod(defaultPeriod);
        setView(ctx.role === 'Cliente Consulta' ? 'history' : 'home');
        // Cargar datos en paralelo
        Promise.all([
          runServer('getRequests', { period: defaultPeriod }).then(r => { setInitialData(r); }),
          runServer('getMasterData', {}).then(m => { setMasterData(m); })
        ]).then(() => setLastSync(Date.now())).catch(console.warn);
      } else {
        setView('unauthorized');
      }
    } catch (e) {
      setInitError(e.message);
    } finally {
      setIsLoading(false);
    }
  };

  const handleLogout = useCallback(() => {
    setUserCtx(null);
    setInitError(null);
    setIsLoading(false);
    setView('loading');
  }, []);

  // Tarea 1: Cierre de sesión por inactividad (10 min)
  useEffect(() => {
    if (!userCtx) return;
    let timer;
    const resetTimer = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        showToast("Sesión cerrada por inactividad.", "warning");
        handleLogout();
      }, 600000); // 10 minutos
    };
    const events = ['mousedown', 'keydown', 'touchstart', 'scroll'];
    events.forEach(e => window.addEventListener(e, resetTimer));
    resetTimer();
    return () => {
      events.forEach(e => window.removeEventListener(e, resetTimer));
      clearTimeout(timer);
    };
  }, [userCtx, handleLogout]);

  useEffect(() => { handleLogin(); }, []);

  if (initError && !userCtx) return (
    <div className="flex h-screen items-center justify-center flex-col gap-4 bg-gray-50 text-red-700 animate-fade-in p-6">
      <Icon name="AlertTriangle" size={48} className="text-red-600"/>
      <div className="text-center">
        <h1 className="text-2xl font-bold mb-2">Error de Conexión</h1>
        <p className="text-sm bg-white p-4 rounded-xl border border-red-200 shadow-sm max-w-md">{initError}</p>
      </div>
      <button onClick={() => window.location.reload()} className="px-6 py-2 bg-gray-800 text-white rounded-xl hover:bg-black transition shadow btn-action">Reintentar</button>
    </div>
  );

  if (!userCtx || view === 'loading') return <LoginView onSuccess={handleLogin} isLoading={isLoading}/>;

  if (view === 'unauthorized') return (
    <div className="flex h-screen items-center justify-center bg-gray-100 text-center p-8">
      <div className="bg-white p-8 rounded-xl shadow-lg max-w-md">
        <Icon name="ShieldCheck" size={48} className="mx-auto text-red-600 mb-4"/>
        <h1 className="text-xl font-bold text-gray-800 mb-2">Acceso Restringido</h1>
        <p className="text-gray-500 text-sm mb-4">Su usuario <strong>{userCtx.email}</strong> no tiene permisos registrados en el sistema.</p>
        <button onClick={() => window.location.reload()} className="text-blue-600 font-bold text-sm hover:underline btn-action">Volver a intentar</button>
      </div>
    </div>
  );

  const renderView = () => {
    const role = userCtx?.role || '';
    switch (view) {
      case 'home':
        if (role === 'Cliente Consulta') return <RequestList setView={setView} setSelectedRequest={setSelectedRequest} initialData={initialData} onRefresh={() => refreshAll(true)} onChangePeriod={handleChangePeriod} currentPeriod={period} refreshing={syncStatus !== 'idle'} userContext={userCtx} masterData={masterData}/>;
        return <HomeDashboard userContext={userCtx} requests={initialData?.data||[]} setView={setView} syncStatus={syncStatus}/>;
      case 'history':
        if (role === 'Cliente Creación') return <HomeDashboard userContext={userCtx} requests={initialData?.data||[]} setView={setView} syncStatus={syncStatus}/>;
        return <RequestList setView={setView} setSelectedRequest={setSelectedRequest} initialData={initialData} onRefresh={() => refreshAll(true)} onChangePeriod={handleChangePeriod} currentPeriod={period} refreshing={syncStatus !== 'idle'} userContext={userCtx} masterData={masterData}/>;
      case 'detail':
        if (role === 'Cliente Creación') return <HomeDashboard userContext={userCtx} requests={initialData?.data||[]} setView={setView} syncStatus={syncStatus}/>;
        return selectedRequest ? <RequestDetail requestId={selectedRequest.ID_SolicitudesConfiabilidad || selectedRequest.NSolicitud} preloadedData={selectedRequest} onBack={() => setView('history')}/> : null;
      case 'create':
        if (role === 'Cliente Consulta') return <RequestList setView={setView} setSelectedRequest={setSelectedRequest} initialData={initialData} onRefresh={() => refreshAll(true)} onChangePeriod={handleChangePeriod} currentPeriod={period} refreshing={syncStatus !== 'idle'} userContext={userCtx} masterData={masterData}/>;
        return <CreateRequest userContext={userCtx} setView={setView} onReload={() => loadRequests()} masterData={masterData}/>;
      case 'bulk':
        if (role === 'Cliente Consulta') return <RequestList setView={setView} setSelectedRequest={setSelectedRequest} initialData={initialData} onRefresh={() => refreshAll(true)} onChangePeriod={handleChangePeriod} currentPeriod={period} refreshing={syncStatus !== 'idle'} userContext={userCtx} masterData={masterData}/>;
        return <BulkUpload userContext={userCtx} setView={setView} onReload={() => loadRequests()}/>;
      case 'config':  return <ConfigurationView userContext={userCtx} onForceSync={() => refreshAll(true)} syncStatus={syncStatus} lastSync={lastSync} onRefreshClients={handleRefreshClients} showToast={showToast}/>;
      default:
        if (role === 'Cliente Consulta') return <RequestList setView={setView} setSelectedRequest={setSelectedRequest} initialData={initialData} onRefresh={() => refreshAll(true)} onChangePeriod={handleChangePeriod} currentPeriod={period} refreshing={syncStatus !== 'idle'} userContext={userCtx} masterData={masterData}/>;
        return <HomeDashboard userContext={userCtx} requests={initialData?.data||[]} setView={setView} syncStatus={syncStatus}/>;
    }
  };

  return (
    <div className="flex h-screen bg-gray-100 text-gray-800 animate-fade-in overflow-hidden">
      {/* Top bar mobile */}
      <div className="md:hidden fixed top-0 left-0 right-0 h-14 bg-white border-b border-gray-200 z-20 flex items-center px-4 justify-between shadow-sm">
        <button onClick={() => setSidebarOpen(true)} className="p-2 -ml-2 text-gray-600 btn-action"><Icon name="Menu" size={23}/></button>
        <span className="font-bold text-gray-800">Confiabilidad</span>
        <div className="w-8"></div>
      </div>

      <Sidebar currentView={view} setView={setView} onLogout={handleLogout} userContext={userCtx} syncStatus={syncStatus} lastSync={lastSync} isOpen={sidebarOpen} toggleSidebar={setSidebarOpen} isCollapsed={isSidebarCollapsed} toggleCollapse={() => setIsSidebarCollapsed(!isSidebarCollapsed)}/>

      <div className={`flex-1 ${isSidebarCollapsed ? 'md:ml-20' : 'md:ml-64'} transition-all duration-300 w-full h-full overflow-y-auto pt-14 md:pt-0`}>
        <ErrorBoundary>{renderView()}</ErrorBoundary>
      </div>

      {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)}/>}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
